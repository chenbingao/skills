# 本地开发用 nginx：在**同一个容器内**对 N 个应用副本做负载均衡。
# 副本分别监听 127.0.0.1:8081 / 8181，只把 nginx 的 8080 暴露给宿主。
# 配合 template-docker-run.sh 使用。

# 【必须单 worker】nginx 的 round-robin 计数器是每个 worker 各自维护、且都从第一个
# peer 开始；worker_processes auto 时并发连接被不同 worker 接受，实测分布 9:1。
worker_processes 1;
events { worker_connections 1024; }

http {
    # 默认 combined 格式**不含** $upstream_addr，没有它无法判断请求落到哪个副本
    log_format dev '$remote_addr -> $upstream_addr "$request" $status rt=$request_time';
    # 日志落文件，由启动脚本 tail -f 汇总到控制台
    access_log /var/log/nginx/access.log dev;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;

    upstream backend {
        # max_fails=1：副本停掉后是「连接超时」而不是「连接被拒」，
        # 默认 3 次意味着每轮询到它都要先卡一次连接超时（实测 rt=3.0s 反复出现）。
        server 127.0.0.1:8081 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:8181 max_fails=1 fail_timeout=10s;
        # 不配 keepalive：开发环境要的是逐请求均匀交替，便于确认请求落到哪个副本。
    }

    server {
        listen 8080;
        server_name _;

        # 按业务上传上限调整
        client_max_body_size 12m;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 停掉的副本要快速失败
            proxy_connect_timeout 1s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
